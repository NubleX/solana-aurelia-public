[package]
name = "aura-splitter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Immutable proportional AURA release splitter (Streamflow vault PDA)"

[lib]
crate-type = ["cdylib", "lib"]
name = "aura_splitter"

[dependencies]
solana-program = "=2.1.21"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }
thiserror = "1.0"
borsh = "1.5"
